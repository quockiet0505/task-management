name: CD - Deploy Task Management App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      # Install Encore CLI
      - name: Install Encore
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> $GITHUB_PATH

      # Build image using Encore (No Dockerfile needed)
      - name: Build & Push Image with Encore
        run: |
          IMAGE=asia-southeast1-docker.pkg.dev/voltarocks-42-sandbox/cloud-engineer-repo/task-management:${{ github.sha }}
          cd app 
          encore build docker $IMAGE
          docker push $IMAGE

      # Get VM instance ID
      - name: Get MIG instance
        run: |
          MIG_NAME=$(gcloud compute instance-groups managed list --zones asia-southeast1-a --filter="baseInstanceName=task-management" --format="value(name)")
          INSTANCE=$(gcloud compute instance-groups managed list-instances $MIG_NAME --zone asia-southeast1-a --format="value(instance.basename())" | head -n 1)
          echo "INSTANCE_NAME=$INSTANCE" >> $GITHUB_ENV

      # SSH and Deploy with Docker Secret
      - name: Deploy Service with Docker Secrets
        run: |
          gcloud compute ssh ${{ env.INSTANCE_NAME }} \
            --zone=asia-southeast1-a \
            --project=voltarocks-42-sandbox \
            --tunnel-through-iap \
            --command="
              set -e
              sudo gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
              IMAGE=asia-southeast1-docker.pkg.dev/voltarocks-42-sandbox/cloud-engineer-repo/task-management:${{ github.sha }}
              RULE='Host(\`duongquockiet.id.vn\`) && PathPrefix(\`/v1/\`)'
              
              echo 'Pulling image...'
              sudo docker pull \$IMAGE

              # Create Docker Secret for .env
              SECRET_NAME=\"task_env_\${{ github.sha }}\"
              echo \"DATABASE_URL=postgres://admin:${{ secrets.DB_PASSWORD }}@core_stack_postgres:5432/appdb\" > prod.env
              cat prod.env | sudo docker secret create \$SECRET_NAME -
              rm prod.env

              # Update or Create Swarm Service
              if sudo docker service inspect task-management > /dev/null 2>&1; then
                echo 'Updating service...'
                OLD_SECRET=\$(sudo docker service inspect task-management --format '{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{.SecretName}}{{end}}')

                sudo docker service update \
                  --image \$IMAGE \
                  --with-registry-auth \
                  --secret-add source=\$SECRET_NAME,target=/.env \
                  --secret-rm \$OLD_SECRET \
                  --force \
                  task-management
              else
                echo 'Creating new service...'
                sudo docker service create \
                  --name task-management \
                  --replicas 1 \
                  --network app_network \
                  --with-registry-auth \
                  --label traefik.enable=true \
                  --label traefik.http.routers.app.rule=\"\$RULE\" \
                  --label traefik.http.services.app.loadbalancer.server.port=4000 \
                  --secret source=\$SECRET_NAME,target=/.env \
                  \$IMAGE
              fi
            "