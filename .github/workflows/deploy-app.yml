name: CD - Deploy Task Management App

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/985227244631/locations/global/workloadIdentityPools/github-action-pool/providers/github-provider
          service_account: github-actions-deploy@voltarocks-42-sandbox.iam.gserviceaccount.com

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Install Encore
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> $GITHUB_PATH

      - name: Build & Push Image with Encore
        run: |
          IMAGE=asia-southeast1-docker.pkg.dev/voltarocks-42-sandbox/cloud-engineer-repo/task-management:${{ github.sha }}

          rm -rf infra
          cd app

          cat <<EOF > encore.config.json
          {
            "secrets": {
              "AUTH_SECRET": "dummy_secret_for_build"
            }
          }
          EOF

          encore build docker $IMAGE --push --config encore.config.json

      - name: Get MIG instance
        run: |
          MIG_NAME=$(gcloud compute instance-groups managed list \
            --project=voltarocks-42-sandbox \
            --zones=asia-southeast1-a \
            --filter="name~task-mig-final" \
            --format="value(name)" | head -n 1)

          INSTANCE=$(gcloud compute instance-groups managed list-instances $MIG_NAME \
            --project=voltarocks-42-sandbox \
            --zone=asia-southeast1-a \
            --format="value(instance.basename())" | head -n 1)

          if [ -z "$INSTANCE" ]; then
            echo "No instance found"
            exit 1
          fi

          echo "INSTANCE_NAME=$INSTANCE" >> $GITHUB_ENV

      - name: Deploy Service
        run: |
          export GCLOUD_SSH_OPTS="--ssh-flag=-oStrictHostKeyChecking=no --ssh-flag=-oUserKnownHostsFile=/dev/null"

          gcloud compute ssh ${{ env.INSTANCE_NAME }} \
            --zone=asia-southeast1-a \
            --project=voltarocks-42-sandbox \
            --tunnel-through-iap \
            $GCLOUD_SSH_OPTS \
            --quiet \
            --command="
              set -e

              sudo gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

              IMAGE=asia-southeast1-docker.pkg.dev/voltarocks-42-sandbox/cloud-engineer-repo/task-management:${{ github.sha }}

              SECRET_NAME=task-env-${{ github.sha }}

              RULE='(Host(\`duongquockiet.id.vn\`) && PathPrefix(\`/v1/\`)) || Path(\`/health\`)'

              echo 'Pulling image...'
              sudo docker pull \$IMAGE

              echo 'Creating env file...'
              echo \"DATABASE_URL=postgres://admin:${{ secrets.DB_PASSWORD }}@postgres:5432/appdb\" > prod.env
              echo \"AUTH_SECRET=${{ secrets.AUTH_SECRET }}\" >> prod.env

              echo 'Creating docker secret...'
              sudo docker secret rm \$SECRET_NAME 2>/dev/null || true
              sudo docker secret create \$SECRET_NAME prod.env
              rm prod.env

              if sudo docker service ls | grep -q task-management; then
                echo 'Updating service...'

                sudo docker service update \
                  --image \$IMAGE \
                  --secret-rm task-env-old || true

                sudo docker service update \
                  --secret-add source=\$SECRET_NAME,target=/.env \
                  --with-registry-auth \
                  --detach=false \
                  task-management

              else
                echo 'Creating service...'

                sudo docker service create \
                  --name task-management \
                  --replicas 2 \
                  --network app_network \
                  --with-registry-auth \
                  --label traefik.enable=true \
                  --label traefik.http.routers.app.entrypoints=web \
                  --label traefik.http.routers.app.rule=\"\$RULE\" \
                  --label traefik.http.services.app.loadbalancer.server.port=4000 \
                  --secret source=\$SECRET_NAME,target=/.env \
                  \$IMAGE
              fi
            "