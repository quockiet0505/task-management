version: "3.8"

services:

  api:
    image: ${API_IMAGE}

    command: >
      /bin/sh -c '
        set -a;
        . /run/secrets/app_secret;
        set +a;
        exec node --enable-source-maps /workspace/.encore/build/combined/combined/main.mjs
      '

    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - app_network

    secrets:
      - source: app_secret
        target: app_secret

    deploy:
      replicas: 2

      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=app_network"
        - "traefik.http.routers.app.entrypoints=web"
        - "traefik.http.routers.app.rule=(Host(`duongquockiet.id.vn`) && PathPrefix(`/v1/`)) || Path(`/health`)"
        - "traefik.http.routers.app.priority=100"
        - "traefik.http.services.app.loadbalancer.server.port=8080"

  web:
    image: ${WEB_IMAGE}

    networks:
      - app_network

    deploy:
      replicas: 1

      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=app_network"
        - "traefik.http.routers.web-ui.entrypoints=web"
        - "traefik.http.routers.web-ui.rule=Host(`duongquockiet.id.vn`)"
        - "traefik.http.routers.web-ui.priority=10"
        - "traefik.http.services.web-ui.loadbalancer.server.port=80"

networks:
  app_network:
    external: true

secrets:
  app_secret:
    external: true
    name: ${SECRET_NAME}